version: "3.8"

# 业务服务容器化编排
# 需要先启动中间件：docker compose -p campusassistant -f docker-compose.middleware.yml up -d

services:
  nacos-init:
    image: curlimages/curl:latest
    container_name: campus-nacos-init
    env_file:
      - ./.env.secret
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ../nacos_config:/nacos_config:ro
      - ./scripts/import-nacos-config.sh:/import-nacos-config.sh:ro
    entrypoint: ["/bin/sh", "/import-nacos-config.sh"]
    networks:
      - campus-net
    restart: "no"

  gateway:
    build:
      context: ../campus-assistant
      dockerfile: campusswu-gateway/Dockerfile
    image: campus-assistant/gateway:latest
    container_name: campus-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - NACOS_SERVER_ADDR=campus-nacos:8848
      - SPIDER_SERVICE_URL=http://campus-spider:8082
      - SERVER_PORT=8080
    volumes:
      - ./config/application-docker.yml:/app/application-docker.yml:ro
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    networks:
      - campus-net

  user-service:
    build:
      context: ../campus-assistant
      dockerfile: user-service/Dockerfile
    image: campus-assistant/user-service:latest
    container_name: campus-user
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NACOS_SERVER_ADDR=campus-nacos:8848
      - SPIDER_SERVICE_URL=http://campus-spider:8082
    volumes:
      - ./config/application-docker.yml:/app/application-docker.yml:ro
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campus-net

  course-service:
    build:
      context: ../campus-assistant
      dockerfile: course-service/Dockerfile
    image: campus-assistant/course-service:latest
    container_name: campus-course
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NACOS_SERVER_ADDR=campus-nacos:8848
    volumes:
      - ./config/application-docker.yml:/app/application-docker.yml:ro
    depends_on:
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - campus-net

  spider-service:
    build:
      context: ../campus-spider-service
      dockerfile: Dockerfile
    image: campus-assistant/spider-service:latest
    container_name: campus-spider
    restart: unless-stopped
    env_file:
      - ./.env.secret
    ports:
      - "8082:8082"
    environment:
      - REDIS_ADDR=campus-redis:6379
      - HTTP_ADDR=:8082
      - JAVA_CALLBACK_URL=http://campus-user:8000/internal/api/v1/sync/student-data
      - PUNCH_CALLBACK_URL=http://campus-user:8000/internal/api/v1/sync/punch-result
      - GRADES_CALLBACK_URL=http://campus-user:8000/internal/api/v1/sync/grades
      - EMPTY_CLASSROOM_CALLBACK_URL=http://campus-user:8000/internal/api/v1/sync/empty-classroom
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - campus-net

  web:
    build:
      context: ../campus-web
      dockerfile: Dockerfile
    image: campus-assistant/web:latest
    container_name: campus-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - campus-net

networks:
  campus-net:
    external: true
